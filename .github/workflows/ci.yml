name: Ledger checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up --build -d --wait
      - name: Create isolated test database
        run: docker compose exec -T database createdb -U ledger ledger_test
      - name: Backend tests including concurrent processes
        run: docker compose exec -T backend php artisan test
      - name: PHP style
        run: docker compose exec -T backend vendor/bin/pint --test app bootstrap/app.php bootstrap/providers.php routes tests database/migrations
      - name: Validator tests, types and build
        run: |
          docker compose exec -T validator npm test
          docker compose exec -T validator npm run typecheck
          docker compose exec -T validator npm run build
      - name: HTTP smoke, validator outage and recovery
        run: |
          result=$(docker compose run --rm --no-deps -T validator node --input-type=module < scripts/smoke.mjs)
          printf '%s\n' "$result"
          merchant_id=$(printf '%s' "$result" | jq -er '.merchant_id')
          docker compose stop validator
          docker compose run --rm --no-deps -T -e SMOKE_MODE=outage -e SMOKE_MERCHANT_ID="$merchant_id" validator node --input-type=module < scripts/smoke.mjs
          docker compose up -d --wait validator
          docker compose run --rm --no-deps -T -e SMOKE_MODE=recovery -e SMOKE_MERCHANT_ID="$merchant_id" validator node --input-type=module < scripts/smoke.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
